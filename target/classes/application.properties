spring.application.name=medibook
server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:h2:file:${user.home}/.medibook/medibook;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.jwt.secret=${JWT_SECRET:VGhpcy1kZWZhdWx0LWtleS1tdXN0LWJlLXJlcGxhY2VkLWluLXByb2R1Y3Rpb24tMzI=}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:8080}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.name=${ADMIN_NAME:MediBook Admin}
app.demo-doctors.enabled=${DEMO_DOCTORS_ENABLED:true}
